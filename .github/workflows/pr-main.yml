name: CI (pull_request -> main)

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tier-1-style-and-lint:
    name: Tier 1 — style + lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  tier-2-check:
    name: Tier 2 — check
    runs-on: ubuntu-latest
    needs: [tier-1-style-and-lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace

  tier-3-component-build:
    name: Tier 3 — component build
    runs-on: ubuntu-latest
    needs: [tier-2-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-component
        run: cargo install cargo-component --locked

      - name: Build folder-watch-actor component (release)
        run: cargo component build --release -p patina-ai-child-folder-watch-actor

      - name: Build watch-null-sink component (release)
        run: cargo component build --release -p patina-ai-child-watch-null-sink
